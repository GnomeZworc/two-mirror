frr defaults traditional
hostname sw1
log syslog informational
!
ip prefix-list RR-LOOPBACK-IN seq 10 permit 10.255.255.1/32
!
route-map RR-IN permit 10
 match ip address prefix-list RR-LOOPBACK-IN
exit
!
route-map NO-OUT deny 999
exit
!
router bgp 65100
 no bgp default ipv4-unicast
 bgp router-id 169.254.0.1
 neighbor 169.254.0.3 remote-as 65000
 neighbor 169.254.0.3 description rr1
 neighbor 169.254.0.3 bfd
 !
 address-family ipv4 unicast
  neighbor 169.254.0.3 activate
  neighbor 169.254.0.3 route-map RR-IN in
  neighbor 169.254.0.3 route-map NO-OUT out
 exit-address-family
 !
exit
!
