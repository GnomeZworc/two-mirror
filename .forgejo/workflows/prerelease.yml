name: Pre Release Workflow

on:
  push:
    tags:
      - '*rc*'

jobs:
  set-release-target:
    runs-on: docker
    outputs:
      release_cible: ${{ steps.setvar.outputs.release_cible }}
    steps:
      - name: Déterminer la release cible
        id: setvar
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "release_cible=$TAG" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "release_cible=latest" >> $GITHUB_OUTPUT
          else
            echo "release_cible=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Afficher la variable
        run: echo "Release cible = ${{ steps.setvar.outputs.release_cible }}"
  build:
    runs-on: docker
    needs: [set-release-target]
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64]
        binaries:
          - metadata
          - agent
    uses: ./.forgejo/workflows/build.yml
    with:
      tag: ${{ needs.set-release-target.outputs.release_cible }}
      goos: ${{ matrix.goos }}
      goarch: ${{ matrix.goarch }}
      binari: ${{ matrix.binaries }}
    secrets: inherit
  # Scripts et units systemd publiés comme assets de release : deploy.sh les
  # installe depuis la release, plus depuis la branche. Ajouter une entrée ici
  # suffit à livrer un nouveau fichier.
  upload-assets:
    runs-on: docker
    needs: [set-release-target]
    strategy:
      matrix:
        include:
          - path: scripts/run-dnsmasq-in-netns.sh
            name: run-dnsmasq-in-netns.sh
          - path: systemd/agent.service
            name: agent.service
          - path: systemd/dnsmasq@.service
            name: dnsmasq@.service
          - path: systemd/metadata@.service
            name: metadata@.service
    steps:
      - uses: actions/checkout@v3
      - name: Move asset
        run: |
          mkdir -p "dist"
          cp "${{ matrix.path }}" dist/
      - name: Upload asset
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.name }}-${{ needs.set-release-target.outputs.release_cible }}
          path: dist/${{ matrix.name }}
  prerelease:
    runs-on: docker
    # upload-assets est dans les needs : sans lui, le job release peut appeler
    # download-artifact avant la fin des uploads et publier une release
    # incomplète (scripts et units manquants de façon non déterministe).
    needs: [set-release-target, build, upload-assets]
    uses: ./.forgejo/workflows/release.yml
    with:
      tag: ${{ needs.set-release-target.outputs.release_cible }}
    secrets: inherit
