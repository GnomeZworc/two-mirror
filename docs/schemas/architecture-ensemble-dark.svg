<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1210" width="1500" height="1210" role="img" aria-label="Vue d'ensemble : Internet, bordures, routeurs du cluster, services, orchestration et hyperviseurs">
  <style>
    .lbl { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #e6edf3; }
    .sub { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #9198a1; }
    .grp { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #9198a1; letter-spacing: .04em; }
    .ctrlt { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #c297ff; }
    .datat { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #4493f8; }
    .orcht { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #3fb950; }
    .nett { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #f0883e; }
    .box { fill: #22272e; stroke: #6e7781; stroke-width: 1.5; }
    .future { fill: #22272e; stroke: #6e7781; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .group { fill: #1c2128; stroke: #444c56; stroke-width: 1.5; }
    .pill { fill: #22272e; stroke: #9198a1; stroke-width: 1.5; }
    .bus { stroke: #9198a1; stroke-width: 4; fill: none; stroke-linecap: round; }
    .link { stroke: #9198a1; stroke-width: 1.8; fill: none; }
    .ctrl { stroke: #c297ff; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
    .data { stroke: #4493f8; stroke-width: 3; fill: none; }
    .orch { stroke: #3fb950; stroke-width: 2; fill: none; stroke-dasharray: 8 4; }
    .net { stroke: #f0883e; stroke-width: 2.4; fill: none; }
    .head-ctrl { fill: #c297ff; }
    .head-data { fill: #4493f8; }
    .head-orch { fill: #3fb950; }
    .head-net { fill: #f0883e; }
  </style>
  <defs>
    <marker id="a-ctrl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-ctrl" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path class="head-data" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a-orch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head-orch" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="a-net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head-net" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>
  <rect class="pill" x="600" y="20" width="300" height="56" rx="28"/>
  <text class="lbl" x="750" y="54" text-anchor="middle">Internet</text>
  <path class="net" d="M750 76 V110" marker-start="url(#a-net)" marker-end="url(#a-net)"/>
  <text class="nett" x="758" y="98" text-anchor="start">agrégats publics</text>
  <rect class="group" x="560" y="110" width="380" height="130" rx="8"/>
  <text class="grp" x="580" y="134">BORDURES · AS PUBLIC · #31</text>
  <rect class="future" x="580" y="140" width="160" height="52" rx="6"/>
  <text class="lbl" x="660.0" y="163.0" text-anchor="middle">bordure 1</text>
  <text class="sub" x="660.0" y="180.0" text-anchor="middle">gateway anycast</text>
  <rect class="future" x="760" y="140" width="160" height="52" rx="6"/>
  <text class="lbl" x="840.0" y="163.0" text-anchor="middle">bordure 2</text>
  <text class="sub" x="840.0" y="180.0" text-anchor="middle">gateway anycast</text>
  <text class="sub" x="750" y="214" text-anchor="middle">même IP et même MAC de gateway · sans état</text>
  <text class="sub" x="750" y="230" text-anchor="middle">VTEP · VNI 66001 (public)</text>
